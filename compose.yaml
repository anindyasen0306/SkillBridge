services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: skillbridge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: skillbridge_db
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U skillbridge -d skillbridge_db']
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://skillbridge:${POSTGRES_PASSWORD}@db:5432/skillbridge_db
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      AI_PROVIDER: groq
      GROQ_API_KEY: ${GROQ_API_KEY:?Set GROQ_API_KEY in .env}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.1-8b-instant}
    depends_on:
      db: {condition: service_healthy}
  frontend:
    build: ./frontend
    ports: ['127.0.0.1:8080:80']
    depends_on: [backend]
volumes:
  pgdata:
